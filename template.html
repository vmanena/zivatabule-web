<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176c4c"><meta name="description" content="{{description}}"><title>{{title}}</title><link rel="icon" type="image/png" href="/assets/ziva_tabule_logo.png"><link rel="apple-touch-icon" href="/assets/ziva_tabule_logo.png"><link rel="stylesheet" href="/style.css">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{socialTitle}}">
<meta property="og:description" content="{{socialDescription}}">
<meta property="og:image" content="{{origin}}/assets/ziva_tabule_logo.png">
<meta property="og:image:secure_url" content="{{origin}}/assets/ziva_tabule_logo.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2000">
<meta property="og:image:height" content="2000">
<meta property="og:image:alt" content="{{logoAlt}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{socialTitle}}">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="{{origin}}/assets/ziva_tabule_logo.png">
{{alternates}}
{{languageDetection}}
</head>
<body><header class="site-header"><div class="top"><a class="brand" href="{{app}}" aria-label="{{appLabel}}"><img class="brand-logo" src="/assets/ziva_tabule_logo.png" alt="" width="42" height="42"><span>{{brand}}</span></a><nav aria-label="{{navLabel}}"><a href="{{app}}">{{appText}}</a>{{navLinks}}</nav>{{links}}</div></header>
<main id="obsah">{{CONTENT}}</main>
<footer><span>{{footer}}</span></footer></body></html>
